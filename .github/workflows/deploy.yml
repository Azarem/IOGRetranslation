name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: |
          package-lock.json
          site/package-lock.json

    - name: Install root dependencies
      run: npm ci

    - name: Generate static ROM package
      run: node scripts/generate-package.ts

    - name: Install site dependencies
      run: cd site && npm ci

    - name: Verify package versions
      run: |
        cd site
        echo "Installed @gaialabs/core version:"
        npm ls @gaialabs/core

    - name: Build site
      run: cd site && npm run build

    - name: Verify generated data
      run: |
        echo "Checking generated data files..."
        ls -la site/public/data/
        echo "Checking built output..."
        ls -la site/dist/
        ls -la site/dist/data/ 2>/dev/null || echo "Data not in dist (will be copied from public)"

    - name: Preserve CNAME file
      if: github.ref == 'refs/heads/main'
      run: |
        if [ -f CNAME ]; then
          echo "Copying CNAME file to dist directory..."
          cp CNAME site/dist/
        else
          echo "No CNAME file found in repository root"
        fi

    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./site/dist
        keep_files: false
        force_orphan: true
